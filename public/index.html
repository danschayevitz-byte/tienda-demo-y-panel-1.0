<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Almacén Don Manolo</title>
<meta name="description" content="Pan del día, leche fresca, yerba y todo lo de la despensa. Armá tu pedido en dos minutos, pagá con Mercado Pago y retirá o recibilo en casa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --g:#0d3a2b;--g2:#145239;--g3:#1d6b4b;--m:#f4b41a;--m2:#ffd774;--r:#d63a26;--cr:#f7f2e5;--cr2:#efe7d2;--ink:#1b1a16;--mut:#6a665a;--line:#e5dcc3;--card:#fff;--ok:#1f8a4c;
  --f-d:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;--f-b:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --rad:18px;--sh:0 1px 2px rgba(27,26,22,.06),0 8px 24px -12px rgba(27,26,22,.18);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font:400 16px/1.5 var(--f-b);color:var(--ink);background:var(--cr);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
h1,h2,h3{font-family:var(--f-d);line-height:1.04;margin:0;letter-spacing:-.02em}
:focus-visible{outline:3px solid var(--m);outline-offset:2px;border-radius:8px}
a,button,input,select,label,summary,[role=button]{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{-webkit-user-select:none;user-select:none}
.ar:focus,.ar:focus-visible{outline:0;box-shadow:0 6px 14px -4px rgba(0,0,0,.35)}

[hidden]{display:none!important}
.wrap{width:min(1240px,100% - 32px);margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ic{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:999px;border:2px solid transparent;font-weight:700;font-size:16px;text-decoration:none;transition:transform .15s,background .15s,box-shadow .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-m{background:var(--m);color:var(--ink);box-shadow:0 6px 0 -2px #b97f00}
.btn-m:hover{background:var(--m2)}
.btn-g{background:var(--g);color:#fff}.btn-g:hover{background:var(--g2)}
.btn-o{border-color:currentColor;background:transparent}
.btn-o:hover{background:rgba(255,255,255,.12)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-block{width:100%}

/* ---------- top bar + header ---------- */
.top{background:var(--ink);color:#f0e8d0;font-size:13px;font-weight:500}
.top .wrap{display:flex;justify-content:center;gap:28px;padding:8px 0;flex-wrap:wrap;text-align:center}
.top b{color:var(--m)}
.hdr{background:var(--g);color:#fff;position:sticky;top:0;z-index:40;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.hdr .wrap{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px 28px;align-items:center;padding:14px 0}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo svg{width:52px;height:52px;flex:none}
.logo .t{display:flex;flex-direction:column;line-height:1}
.logo .t small{font:700 11px/1 var(--f-b);letter-spacing:.32em;color:var(--m);text-transform:uppercase;margin-bottom:5px}
.logo .t b{font:800 28px/.95 var(--f-d);letter-spacing:-.02em;color:#fff}
.search{position:relative;max-width:720px;width:100%}
.search form{display:flex;background:#fff;border-radius:999px;padding:5px;box-shadow:inset 0 0 0 2px transparent}
.search form:focus-within{box-shadow:0 0 0 3px var(--m)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font:500 16px var(--f-b);padding:0 20px;color:var(--ink)}
.search button{width:44px;height:44px;border-radius:50%;border:0;background:var(--g);color:#fff;display:grid;place-items:center}
.sug{position:absolute;left:0;right:0;top:calc(100% + 8px);background:#fff;color:var(--ink);border-radius:18px;box-shadow:0 20px 50px -10px rgba(0,0,0,.35);overflow:hidden;z-index:60}
.sug a{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 14px;text-decoration:none}
.sug a:hover,.sug a:focus{background:var(--cr)}
.sug img{width:48px;height:48px;object-fit:contain;mix-blend-mode:multiply}
.sug b{font-weight:600;font-size:15px;line-height:1.2}.sug small{display:block;color:var(--mut);font-size:13px}
.sug .pr{font:800 17px var(--f-d)}
.sug .all{display:block;padding:12px 16px;font-weight:700;border-top:1px solid var(--line);color:var(--g)}
.acts{display:flex;gap:8px;align-items:center}
.ib{position:relative;display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 14px;border-radius:999px;border:0;background:rgba(255,255,255,.1);color:#fff;text-decoration:none;font-weight:700;font-size:15px}
.ib:hover{background:rgba(255,255,255,.2)}
.ib .n{position:absolute;top:-4px;right:-2px;min-width:22px;height:22px;border-radius:99px;background:var(--m);color:var(--ink);font:800 12px/22px var(--f-b);text-align:center;padding:0 5px}
.ib.pop .n{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.5)}}
.ib.cart{background:var(--m);color:var(--ink)}.ib.cart:hover{background:var(--m2)}
.ib.cart .n{background:var(--g);color:#fff}
.cats{background:#fff;border-bottom:1px solid var(--line)}
.cats ul{list-style:none;margin:0;padding:14px 0;display:flex;gap:6px 22px;overflow-x:auto;scrollbar-width:none;justify-content:center}
.cats ul::-webkit-scrollbar{display:none}
.cats a{display:flex;flex-direction:column;align-items:center;gap:8px;width:92px;text-decoration:none;font:600 13px/1.2 var(--f-b);text-align:center;color:var(--ink)}
.cats .c{width:68px;height:68px;border-radius:50%;background:var(--cr);border:2px solid var(--line);display:grid;place-items:center;overflow:hidden;transition:border-color .15s,transform .15s}
.cats .c img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;padding:6px}
.cats a:hover .c,.cats a[aria-current] .c{border-color:var(--g);transform:translateY(-3px)}
.cats a[aria-current]{color:var(--g)}

/* ---------- hero ---------- */
.hero{background:var(--g);color:#fff;position:relative;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.5;background:
  radial-gradient(circle at 1px 1px,rgba(244,180,26,.35) 1.5px,transparent 2px) 0 0/26px 26px;
  -webkit-mask-image:linear-gradient(90deg,transparent 35%,#000 100%);mask-image:linear-gradient(90deg,transparent 35%,#000 100%)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:40px;align-items:center;padding:56px 0 64px}
.kick{display:inline-flex;gap:10px;align-items:center;background:rgba(255,255,255,.1);border-radius:99px;padding:7px 16px 7px 8px;font-weight:600;font-size:14px;margin-bottom:22px}
.kick i{width:26px;height:26px;border-radius:50%;background:var(--m);color:var(--ink);display:grid;place-items:center}
.hero h1{font-size:clamp(44px,6.6vw,92px);font-weight:800;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--m)}
.hero p.lead{font-size:clamp(17px,1.6vw,20px);color:#d6e6dc;max-width:46ch;margin:22px 0 30px}
.hero .cta{display:flex;gap:14px;flex-wrap:wrap}
.hero .btn-o{color:#fff}
.collage{position:relative;aspect-ratio:1/1;max-width:560px;margin-inline:auto;width:100%}
.collage .t{position:absolute;border-radius:28px;display:grid;place-items:center;box-shadow:0 24px 40px -18px rgba(0,0,0,.5);overflow:hidden;animation:fl 7s ease-in-out infinite}
.collage .t img{width:88%;height:88%;object-fit:contain;mix-blend-mode:multiply}
.collage .t:nth-child(1){left:4%;top:6%;width:48%;height:48%;background:var(--m2);transform:rotate(-5deg)}
.collage .t:nth-child(2){right:0;top:0;width:40%;height:40%;background:#fff;transform:rotate(4deg);animation-delay:-2s}
.collage .t:nth-child(3){left:0;bottom:2%;width:40%;height:40%;background:#cfe6d7;transform:rotate(3deg);animation-delay:-4s}
.collage .t:nth-child(4){right:2%;bottom:0;width:52%;height:52%;background:#fff;transform:rotate(-3deg);animation-delay:-1s}
.collage .st{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-8deg);z-index:3;background:var(--r);color:#fff;font:800 20px/1 var(--f-d);padding:14px 20px;border-radius:14px;text-align:center;box-shadow:0 10px 20px -8px rgba(0,0,0,.5)}
.collage .st small{display:block;font:600 12px var(--f-b);opacity:.9;margin-top:4px}
@keyframes fl{50%{translate:0 -8px}}

/* ---------- strip ---------- */
.strip{background:var(--cr2);border-bottom:1px solid var(--line)}
.strip ul{list-style:none;margin:0;padding:18px 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.strip li{display:flex;gap:12px;align-items:center;font-size:14px;line-height:1.25}
.strip li i{width:42px;height:42px;border-radius:50%;background:var(--g);color:var(--m);display:grid;place-items:center;flex:none}
.strip b{display:block;font-size:15px}

/* ---------- sections ---------- */
.sec{padding:52px 0 8px}
.sh{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px}
.sh h2{font-size:clamp(28px,3.4vw,42px);font-weight:800}
.sh .lk{font-weight:700;color:var(--g);text-decoration:none;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.sh .lk:hover{text-decoration:underline}
.arr{display:flex;gap:8px}
.arr button{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:#fff;display:grid;place-items:center}
.arr button:hover{background:var(--ink);color:#fff}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(188px,214px);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 18px;scrollbar-width:none;margin-inline:-2px}
.rail::-webkit-scrollbar{display:none}.rail>*{scroll-snap-align:start}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.tile{position:relative;border-radius:26px;padding:22px;min-height:230px;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;overflow:hidden;color:var(--ink);transition:transform .2s}
.tile:hover{transform:translateY(-4px)}
.tile h3{font-size:26px;font-weight:800;max-width:11ch;position:relative;z-index:2}
.tile p{margin:8px 0 0;font-size:14px;max-width:17ch;position:relative;z-index:2;opacity:.85}
.tile .go{width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;position:relative;z-index:1}
.tile img{position:absolute;right:-6px;bottom:-6px;width:54%;height:80%;object-fit:contain;object-position:right bottom;mix-blend-mode:multiply;transition:transform .3s;-webkit-mask-image:radial-gradient(ellipse 62% 62% at 52% 52%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 62% 62% at 52% 52%,#000 62%,transparent 100%)}
.tile:hover img{transform:scale(1.08) rotate(-3deg)}
.tile:nth-child(8n+1){background:var(--m)}.tile:nth-child(8n+2){background:#cfe6d7}.tile:nth-child(8n+3){background:#f6c1b6}
.tile:nth-child(8n+4){background:#bcd5ee}.tile:nth-child(8n+5){background:#f3e08c}.tile:nth-child(8n+6){background:#d9cdea}.tile:nth-child(8n+7){background:#c8e2b6}.tile:nth-child(8n+8){background:#f4cf9c}

/* ---------- product card ---------- */
.card{position:relative;background:var(--card);border-radius:var(--rad);display:flex;flex-direction:column;box-shadow:var(--sh);border:1px solid var(--line);overflow:hidden;transition:transform .18s,box-shadow .18s}
.card:hover{transform:translateY(-3px);box-shadow:0 18px 30px -16px rgba(27,26,22,.35)}
.card .ph{aspect-ratio:1/1;display:block;background:#fff;position:relative}
.card .ph img{width:100%;height:100%;object-fit:contain;padding:10%;mix-blend-mode:multiply;transition:transform .3s}
.card:hover .ph img{transform:scale(1.05)}
.card .bd{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:5px;align-items:flex-start;z-index:2}
.bg{background:var(--ink);color:#fff;font:700 11.5px/1 var(--f-b);padding:6px 9px;border-radius:6px;letter-spacing:.01em}
.bg.off{background:var(--r)}.bg.low{background:#fff;color:var(--r);box-shadow:inset 0 0 0 1.5px var(--r)}.bg.top{background:var(--m);color:var(--ink)}
.fav{position:absolute;top:8px;right:8px;z-index:2;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.9);display:grid;place-items:center;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.fav[aria-pressed=true]{color:var(--r)}.fav[aria-pressed=true] .ic{fill:currentColor}
.card .in{padding:2px 14px 14px;display:flex;flex-direction:column;gap:3px;flex:1}
.brand{font:700 12px/1.2 var(--f-b);text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
.card h3{font:600 16px/1.25 var(--f-b);letter-spacing:0;min-height:2.5em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card h3 a{text-decoration:none}.card h3 a:hover{text-decoration:underline}
.cont{font-size:13.5px;color:var(--mut)}
.pr{margin-top:auto;padding-top:8px;display:flex;flex-direction:column}
.was{font-size:13px;color:var(--mut);text-decoration:line-through}
.p{font:800 28px/1 var(--f-d);letter-spacing:-.02em;display:flex;align-items:flex-start;gap:2px}
.p small{font:700 14px/1 var(--f-b);margin-top:4px}
.p.off{color:var(--r)}
.u{font-size:12.5px;color:var(--mut);margin-top:3px}
.act{margin-top:12px}
.add{width:100%;height:44px;border-radius:999px;border:2px solid var(--g);background:#fff;color:var(--g);font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
@media (hover:hover){.add:hover{background:var(--g);color:#fff}}
.add:active{background:var(--g);color:#fff}
.add[disabled]{border-color:var(--line);color:var(--mut);background:var(--cr);cursor:not-allowed}
.stp{display:flex;align-items:center;justify-content:space-between;height:44px;border-radius:999px;background:var(--g);color:#fff;padding:0 5px}
.stp button{width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center}
.stp button:hover{background:rgba(255,255,255,.3)}
.stp b{font:700 16px var(--f-b);min-width:70px;text-align:center}
.stp b small{display:block;font:500 11px/1 var(--f-b);opacity:.8}

/* ---------- feature band ---------- */
.feat{margin-top:56px;background:var(--m);position:relative;overflow:hidden}
.feat .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center;padding:56px 0}
.feat .pic{background:#fff;border-radius:36px;aspect-ratio:1/1;max-width:520px;width:100%;display:grid;place-items:center;transform:rotate(-2deg);box-shadow:0 30px 50px -24px rgba(0,0,0,.45)}
.feat .pic img{width:86%;mix-blend-mode:multiply}
.feat h2{font-size:clamp(36px,5vw,68px);font-weight:800;margin-bottom:16px}
.feat p{font-size:18px;max-width:44ch;margin:0 0 24px}
.feat .pp{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.feat .p{font-size:46px}

.how{margin-top:56px;background:var(--g);color:#fff;border-radius:32px;padding:40px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;position:relative}
.how h2{grid-column:1/-1;font-size:clamp(28px,3.4vw,42px)}
.how .s b{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--m);color:var(--ink);font:800 22px var(--f-d);margin-bottom:12px}
.how .s h3{font:700 20px/1.2 var(--f-b);letter-spacing:0;margin-bottom:6px}
.how .s p{margin:0;color:#cfe2d7;font-size:15px}

/* ---------- catalog ---------- */
.cathd{padding:34px 0 8px}
.crumbs{font-size:14px;color:var(--mut);margin-bottom:10px}.crumbs a{text-decoration:none;font-weight:600}.crumbs a:hover{text-decoration:underline}
.cathd h1{font-size:clamp(34px,5vw,60px);font-weight:800}
.cathd p{color:var(--mut);margin:8px 0 0;max-width:60ch}
.cl{display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;padding:20px 0 40px;align-items:start}
.side{position:sticky;top:96px;background:#fff;border:1px solid var(--line);border-radius:var(--rad);padding:18px}
.side h4{font:700 12px var(--f-b);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:0 0 10px}
.side ul{list-style:none;margin:0 0 20px;padding:0}
.side li a{display:flex;justify-content:space-between;padding:9px 12px;border-radius:12px;text-decoration:none;font-weight:600;font-size:15px}
.side li a:hover{background:var(--cr)}.side li a[aria-current]{background:var(--g);color:#fff}
.side li a span{opacity:.6;font-weight:500}
.side label{display:flex;gap:10px;align-items:center;font-weight:500;padding:6px 4px;cursor:pointer}
.side input[type=checkbox]{width:20px;height:20px;accent-color:var(--g)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.bar .cnt{color:var(--mut);font-weight:500}
select.so{height:44px;border-radius:999px;border:2px solid var(--line);background:#fff;padding:0 16px;font:600 15px var(--f-b)}
.chips{display:none;gap:8px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.chips a{white-space:nowrap;padding:9px 16px;border-radius:99px;background:#fff;border:2px solid var(--line);text-decoration:none;font-weight:600;font-size:14px}
.chips a[aria-current]{background:var(--g);color:#fff;border-color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.empty{text-align:center;padding:60px 20px;background:#fff;border-radius:var(--rad);border:1px dashed var(--line)}
.empty h2{font-size:32px;margin-bottom:8px}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(13,26,20,.55);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;backdrop-filter:blur(2px)}
.scrim.on{opacity:1;pointer-events:auto}
.modal{position:fixed;z-index:90;left:50%;top:50%;width:min(980px,calc(100% - 32px));max-height:calc(100dvh - 32px);overflow:auto;background:var(--cr);border-radius:28px;transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;transition:.22s}
.modal.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.x{position:absolute;top:14px;right:14px;z-index:3;width:44px;height:44px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center;box-shadow:var(--sh)}
.pd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pd .pic{background:#fff;display:grid;place-items:center;aspect-ratio:1/1;position:relative}
.pd .pic img{width:100%;height:100%;object-fit:contain;padding:8%;mix-blend-mode:multiply}
.pd .tx{padding:34px 32px;display:flex;flex-direction:column;gap:10px}
.pd h2{font-size:clamp(28px,3vw,40px);font-weight:800;margin:4px 0 0}
.pd .p{font-size:54px}.pd .stk{display:inline-flex;gap:8px;align-items:center;font-weight:600;font-size:14px}
.pd .stk::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ok)}.pd .stk.low::before{background:var(--r)}.pd .stk.out::before{background:var(--mut)}
.pd .ds{color:#3d3a31;margin:6px 0}
.pd dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 18px;margin:4px 0 0;font-size:14.5px;padding-top:14px;border-top:1px solid var(--line)}
.pd dt{color:var(--mut)}.pd dd{margin:0;font-weight:600}
.pd .row{display:flex;gap:10px;margin-top:8px}
.pd .row .act{flex:1;margin:0}.pd .row .add,.pd .row .stp{height:52px}
.rel{padding:6px 28px 30px}.rel h3{font:800 24px var(--f-d);margin:18px 0 14px}
.rel .grid{grid-template-columns:repeat(4,minmax(0,1fr))}

/* ---------- drawer ---------- */
.dr{position:fixed;z-index:90;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--cr);transform:translateX(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 50px -20px rgba(0,0,0,.4)}
.dr.on{transform:none}
.dr header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;background:var(--g);color:#fff}
.dr header h2{font-size:26px}
.dr header .x{position:static;background:rgba(255,255,255,.15);color:#fff;box-shadow:none}
.free{padding:14px 20px;background:#fff;border-bottom:1px solid var(--line);font-size:14.5px}
.free .tr{height:10px;border-radius:9px;background:var(--cr2);margin-top:8px;overflow:hidden}
.free .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--g3),var(--m));border-radius:9px;transition:width .35s}
.free.ok{background:#e7f5ec;color:#14633a;font-weight:600}
.dr .ls{flex:1;overflow:auto;padding:8px 20px;list-style:none;margin:0}
.li{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.li .th{width:72px;height:72px;background:#fff;border-radius:14px;border:1px solid var(--line)}
.li .th img{width:100%;height:100%;object-fit:contain;padding:6px;mix-blend-mode:multiply}
.li h3{font:600 15px/1.25 var(--f-b);letter-spacing:0}
.li .m{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.li .stp{height:38px;width:128px}.li .stp button{width:30px;height:30px}.li .stp b{min-width:0;font-size:15px}
.li .pt{font:800 19px var(--f-d)}
.li .rm{background:none;border:0;color:var(--mut);font-size:13px;text-decoration:underline;padding:0;margin-top:2px}
.dr footer{padding:16px 20px calc(16px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.tot b{font:800 30px var(--f-d)}
.nul{text-align:center;padding:48px 20px;color:var(--mut)}.nul h3{font-size:26px;color:var(--ink);margin-bottom:6px}

/* ---------- checkout ---------- */
.co{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:32px;padding:10px 0 50px;align-items:start}
.box{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px;margin-bottom:18px}
.box h2{font:800 24px var(--f-d);display:flex;gap:12px;align-items:center;margin-bottom:18px}
.box h2 b{width:34px;height:34px;border-radius:50%;background:var(--m);display:grid;place-items:center;font-size:17px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font-weight:600;font-size:14px}
.fld input,.fld textarea{height:50px;border-radius:14px;border:2px solid var(--line);padding:0 16px;font:500 16px var(--f-b);background:var(--cr);width:100%}
.fld textarea{height:84px;padding:12px 16px;resize:vertical}
.fld input:focus,.fld textarea:focus{outline:0;border-color:var(--g);background:#fff}
.fld.bad input,.fld.bad textarea{border-color:var(--r)}.fld .er{color:var(--r);font-size:13px;font-weight:600}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.opt{display:flex;gap:14px;align-items:center;border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;cursor:pointer;background:var(--cr);transition:.15s}
.opt:has(input:checked){border-color:var(--g);background:#eef7f1}
.opt input{width:22px;height:22px;accent-color:var(--g);flex:none}
.opt .tt{flex:1;line-height:1.25}.opt .tt small{display:block;color:var(--mut);font-size:13.5px}
.opt .co2{font:800 18px var(--f-d);white-space:nowrap}
.sum{position:sticky;top:96px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px}
.sum h2{font:800 24px var(--f-d);margin-bottom:12px}
.sum ul{list-style:none;margin:0 0 14px;padding:0;max-height:300px;overflow:auto}
.sum li{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;font-size:14.5px;line-height:1.25}
.sum li img{width:46px;height:46px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;mix-blend-mode:multiply}
.sum .rw{display:flex;justify-content:space-between;padding:6px 0;color:#3d3a31}
.sum .rw.t{border-top:2px solid var(--ink);margin-top:8px;padding-top:14px;font:800 30px var(--f-d);color:var(--ink);align-items:baseline}
.sum .rw .g{color:var(--ok);font-weight:700}
.note{font-size:13px;color:var(--mut);display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px;text-align:center}
.alert{background:#fdeceb;color:#8b1d10;border-radius:14px;padding:14px 16px;font-weight:600;margin-bottom:14px}
.ty{max-width:640px;margin:50px auto;background:#fff;border-radius:28px;padding:44px 36px;text-align:center;border:1px solid var(--line)}
.ty .ok{width:84px;height:84px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin:0 auto 18px;font-size:34px}
.ty .ok.w{background:var(--m);color:var(--ink)}.ty .ok.e{background:var(--r)}
.ty h1{font-size:40px;font-weight:800;margin-bottom:10px}.ty p{color:#3d3a31;margin:0 0 22px}
.ty .rf{display:inline-block;background:var(--cr);border-radius:10px;padding:6px 12px;font:600 13px ui-monospace,monospace;margin-bottom:22px}

/* ---------- footer ---------- */
.ft{background:var(--ink);color:#d9d2bc;margin-top:64px;padding:48px 0 0}
.ft .wrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:32px;padding-bottom:36px}
.ft h4{font:700 12px var(--f-b);letter-spacing:.12em;text-transform:uppercase;color:var(--m);margin:0 0 12px}
.ft p,.ft li{margin:0 0 6px;font-size:15px}.ft ul{list-style:none;margin:0;padding:0}.ft a{text-decoration:none}.ft a:hover{text-decoration:underline}
.ft .lg{font:800 40px/1 var(--f-d);color:#fff;margin-bottom:10px}
.ft .cp{border-top:1px solid #34322b;padding:16px 0;font-size:13px;color:#8d8775}
.wa{position:fixed;right:18px;bottom:18px;z-index:50;width:60px;height:60px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px -6px rgba(0,0,0,.4);text-decoration:none}
.wa .ic{width:30px;height:30px}
.cb{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:60;display:none;align-items:center;justify-content:space-between;gap:12px;background:var(--g);color:#fff;border:0;border-radius:999px;padding:8px 8px 8px 22px;font-weight:700;box-shadow:0 14px 30px -10px rgba(0,0,0,.55)}
.cb span{display:flex;gap:10px;align-items:center}.cb b{background:var(--m);color:var(--ink);border-radius:99px;padding:12px 20px;font:800 17px var(--f-d)}
.toast{position:fixed;left:50%;bottom:90px;max-width:calc(100% - 32px);text-align:center;transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;font-weight:600;z-index:120;opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--sh)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.demo{background:#fff3cd;border-bottom:1px solid #ecd48a;text-align:center;font-size:13.5px;padding:7px 12px;font-weight:600;color:#6b5200}
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}html{scroll-behavior:auto}}



/* ---- flechas para deslizar (carruseles, rubros, chips) ---- */
.sw{position:relative;min-width:0;max-width:100%}
.ar{position:absolute;top:var(--ay,50%);transform:translateY(-50%);z-index:6;width:42px;height:42px;border-radius:50%;border:2px solid var(--ink);background:#fff;color:var(--ink);display:grid;place-items:center;padding:0;box-shadow:0 6px 14px -4px rgba(0,0,0,.35);transition:transform .15s,background .15s,opacity .2s}
.ar:active{transform:translateY(-50%) scale(.92)}
@media (hover:hover){.ar:hover{background:var(--m)}}
.ar.l{left:2px}.ar.r{right:2px}
.ar[hidden]{display:none!important}
.ar .ic{width:20px;height:20px}
.ar.r .ic{animation:nudge 1.6s ease-in-out infinite}.ar.l .ic{animation:nudgel 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(3px)}}@keyframes nudgel{50%{transform:translateX(-3px)}}
.sw.rl .ar{--ay:34%}.sw.cn .ar{--ay:42%;width:36px;height:36px}.sw.ch .ar{width:34px;height:34px}
.sw.cn .ar{border-color:var(--g)}
@media (prefers-reduced-motion:reduce){.ar .ic{animation:none!important}}
body.in-co .cb{display:none!important}body.in-co{padding-bottom:0!important}
/* ---- anti-desborde (celular): las grillas se achican al ancho real ---- */
html,body{max-width:100%;overflow-x:clip}
.cl>*,.pd>*,.co>*,.hero .wrap>*,.feat .wrap>*,.how>*,.ft .wrap>*,.two>*,.hdr .wrap>*,.tiles>*,.grid>*,.strip li,.box,.sum,.opt .tt,.li>div,.sum li>span{min-width:0}
.chips,.bar,.cl>div,.rel,.rel .grid{max-width:100%}
.opt .tt,.card h3,.sug b,.li h3{overflow-wrap:anywhere}
.fld input,.fld textarea,select.so{max-width:100%}
@media (max-width:1020px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cl{grid-template-columns:minmax(0,1fr)}.side{display:none}.chips{display:flex}
  .co{grid-template-columns:minmax(0,1fr)}.sum{position:static}
  .rel .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .hdr .wrap{grid-template-columns:minmax(0,1fr) auto;padding:10px 0;gap:10px}
  .search{grid-column:1/-1;order:3}
  .logo svg{width:42px;height:42px}.logo .t b{font-size:23px}
  .ib span.l{display:none}.ib{padding:0 13px}
  .ib.cart{display:none}
  .cb{display:flex}body{padding-bottom:84px}.wa{bottom:92px;width:54px;height:54px}
  .cats ul{justify-content:flex-start}.cats a{width:78px}.cats .c{width:60px;height:60px}
  .hero .wrap{grid-template-columns:minmax(0,1fr);padding:36px 0 44px;gap:28px}
  .collage{max-width:340px}
  .strip ul{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .feat .wrap,.how{grid-template-columns:minmax(0,1fr)}.how{padding:28px 22px;border-radius:24px}
  .feat .wrap{padding:40px 0}
  .pd{grid-template-columns:minmax(0,1fr)}.pd .pic{aspect-ratio:4/3}.pd .tx{padding:22px 20px}
  .modal{top:auto;bottom:0;left:0;width:100%;max-height:92dvh;border-radius:28px 28px 0 0;transform:translateY(100%)}.modal.on{transform:none}
  .rail{grid-auto-columns:minmax(164px,176px)}
  .arr{display:none}
  .two{grid-template-columns:minmax(0,1fr)}.box{padding:20px}
  .ft .wrap{grid-template-columns:minmax(0,1fr)}
  .top .wrap{gap:4px 16px;font-size:12px}
  .card h3{font-size:15px}.p{font-size:25px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .sec{padding-top:40px}
  .tile{padding:18px;min-height:210px}.tile h3{font-size:21px;max-width:none}.tile p{font-size:13px;max-width:15ch}
}

  }
  function fieldErr(name, msg) {
    var inp = $('[name="' + name + '"]'); if (!inp) return; var f = inp.closest(".fld"); f.classList.add("bad");
    if (!f.querySelector(".er")) f.insertAdjacentHTML("beforeend", '<span class="er">' + msg + "</span>");
  }
  function validate() {
    var ok = true; $$(".fld.bad").forEach(function (f) { f.classList.remove("bad"); }); $$(".er").forEach(function (e) { e.remove(); });
    if (form.nombre.trim().length < 2) { fieldErr("nombre", "Escribí tu nombre."); ok = false; }
    if (form.telefono.replace(/\D/g, "").length < 8) { fieldErr("telefono", "Revisá el teléfono."); ok = false; }
    if (S.pago === "mp" && !/^\S+@\S+\.\S+$/.test(form.email.trim())) { fieldErr("email", "Necesitamos un email válido."); ok = false; }
    if (zona().envio && form.direccion.trim().length < 5) { fieldErr("direccion", "Escribí la dirección de entrega."); ok = false; }
    if (!ok) { var b = $(".fld.bad"); if (b) b.scrollIntoView({ block: "center", behavior: "smooth" }); }
    return ok;
  }
  function orderText(ref) {
    var sub = subtotal(), env = envio(sub), z = zona(), L = ["*Pedido " + (S.config.nombre || "") + "*" + (ref ? " (" + ref + ")" : ""), ""];
    Object.keys(S.cart).forEach(function (id) { var p = S.byId[id]; L.push(S.cart[id] + " × " + p.nombre + " (" + p.contenido + ") — " + money(p.precio * S.cart[id])); });
    L.push("", "Subtotal: " + money(sub), "Entrega: " + z.nombre + " — " + (env ? money(env) : "sin costo"), "*Total: " + money(sub + env) + "*", "", "Nombre: " + form.nombre, "Teléfono: " + form.telefono);
    if (z.envio) L.push("Dirección: " + form.direccion); if (form.nota) L.push("Aclaraciones: " + form.nota);
    return L.join("\n");
  }
  function showAlert(msg, withWa) {
    var a = $("#alert"); if (!a) return;
    a.innerHTML = '<div class="alert">' + esc(msg) + (withWa && S.config.whatsapp ? ' <a href="https://wa.me/' + S.config.whatsapp + "?text=" + encodeURIComponent(orderText()) + '" target="_blank" rel="noopener">Enviar el pedido por WhatsApp</a>' : "") + "</div>"; a.scrollIntoView({ block: "center", behavior: "smooth" });
  }
  function submitOrder() {
    if (!validate()) return;
    var btn = $("#pay");
    if (S.pago === "wa") {
      var ref = "DM-" + Date.now().toString(36).toUpperCase(), url = "https://wa.me/" + S.config.whatsapp + "?text=" + encodeURIComponent(orderText(ref));
      window.open(url, "_blank", "noopener"); finish("wa", ref); return;
    }
    if (CFG.demo) { showDemo(); return; }
    btn.disabled = true; btn.textContent = "Preparando tu pago…";
    var payload = { items: Object.keys(S.cart).map(function (id) { return { id: id, qty: S.cart[id] }; }), zona: S.zona, cliente: { nombre: form.nombre.trim(), telefono: form.telefono.trim(), email: form.email.trim(), direccion: form.direccion.trim(), nota: form.nota.trim() } };
    fetch((CFG.apiBase || "") + "/api/checkout", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok || !d.init_point) throw new Error(d.error || "No pudimos iniciar el pago. Probá de nuevo en unos minutos."); return d; }); })
      .then(function (d) { window.location.assign(d.init_point); })
      .catch(function (e) { btn.disabled = false; renderCheckoutSummary(); showAlert(e.message || "No pudimos iniciar el pago.", true); });
  }
  function showDemo() {
    var a = $("#alert"); a.innerHTML = '<div class="alert" style="background:#fff3cd;color:#6b5200">Esto es una vista previa: en la tienda publicada, este botón te lleva a Mercado Pago para pagar de forma segura y después volvés acá. Todo lo demás (carrito, datos y envío) ya funciona.</div>'; a.scrollIntoView({ block: "center", behavior: "smooth" });
  }
  function finish(kind, ref, estado) {
    var msg = S.config.mensajeConfirmacion || "¡Gracias por tu compra!";
    var t = { ok: ["ok", "✓", "¡Pago confirmado!", msg], pend: ["ok w", "…", "Estamos esperando el pago", "Mercado Pago todavía está procesando tu pago. Apenas se acredite, el almacén ve tu pedido y se pone en contacto con vos."], fail: ["ok e", "!", "El pago no se completó", "No se hizo ningún cobro. Podés volver a intentarlo cuando quieras; tu pedido sigue guardado."], wa: ["ok", "✓", "¡Pedido enviado!", "Se abrió WhatsApp con tu pedido. Mandalo y el almacén te confirma la entrega."], ver: ["ok w", "…", "Estamos verificando tu pago", "Mercado Pago nos avisa en unos minutos. Cuando esté acreditado, el almacén te escribe para coordinar."] }[kind];
    if (kind === "ok" || kind === "pend" || kind === "wa" || kind === "ver") { S.cart = {}; lsSet("dm_cart", S.cart); }
    cartUI();
    view.innerHTML = '<div class="wrap"><div class="ty"><div class="' + t[0] + '">' + t[1] + "</div><h1>" + t[2] + "</h1><p>" + esc(t[3]) + "</p>" + (ref ? '<div class="rf">Pedido ' + esc(ref) + "</div><br>" : "") + '<a class="btn btn-g" href="' + (kind === "fail" ? "#/checkout" : "#/") + '">' + (kind === "fail" ? "Volver a intentar" : "Seguir comprando") + "</a></div></div>";
    history.replaceState(null, "", location.pathname + "#/gracias"); window.scrollTo(0, 0); document.title = t[2];
  }
  function handleReturn() {
    var P = new URLSearchParams(location.search), pago = P.get("pago"), ref = P.get("ref") || "";
    if (!pago) return false;
    history.replaceState(null, "", location.pathname + location.hash);
    if (pago === "fallo") { finish("fail", ref); return true; }
    view.innerHTML = '<div class="wrap"><div class="ty"><h1>Confirmando tu pago…</h1><p>Un segundito.</p></div></div>';
    fetch((CFG.apiBase || "") + "/api/estado?ref=" + encodeURIComponent(ref)).then(function (r) { return r.json(); }).then(function (d) {
      if (d.estado === "aprobado") finish("ok", ref); else if (d.estado === "rechazado") finish("fail", ref); else if (d.estado === "pendiente") finish("pend", ref); else finish("ver", ref);
    }).catch(function () { finish("ver", ref); });
    return true;
  }

  /* ---------- chrome ---------- */
  function chrome() {
    var c = S.config, g = c.envioGratisDesde;
    $("#top").innerHTML = "<span><b>" + (g ? "Envío gratis" : "Envíos") + "</b>" + (g ? " desde " + money(g) : " a domicilio") + "</span><span>Retiro <b>sin costo</b> en el almacén</span>" + (c.horario ? "<span>" + esc(c.horario) + "</span>" : "");
    $("#catnav").innerHTML = S.categorias.map(function (k) { return '<li><a href="#/catalogo?cat=' + esc(k.id) + '" data-cn="' + esc(k.id) + '"><span class="c"><img src="' + esc(catImg(k)) + '" alt=""></span>' + esc(k.nombre.split(" y ")[0]) + "</a></li>"; }).join("");
    var wa = c.whatsapp; var w = $("#wa"); w.hidden = !wa; if (wa) w.href = "https://wa.me/" + wa + "?text=" + encodeURIComponent("Hola! Quería hacer una consulta.");
    $("#demo").hidden = !CFG.demo; setTimeout(arrows, 0);
    $("#ft").innerHTML = '<div class="wrap"><div><div class="lg">' + esc(c.nombre) + "</div><p>" + esc(c.lema || "") + '</p></div><div><h4>' + (c.direccion || c.horario || wa || c.instagram || c.email ? "Pasá o escribinos" : "Entregas") + '</h4><ul>' + (!(c.direccion || c.horario || wa || c.instagram || c.email) ? S.envios.map(function (z) { return "<li>" + esc(z.nombre) + " · " + (z.costo ? money(z.costo) : "sin costo") + "</li>"; }).join("") : "") + (c.direccion ? "<li>" + ic("pin") + " " + esc(c.direccion) + "</li>" : "") + (c.horario ? "<li>" + ic("clock") + " " + esc(c.horario) + "</li>" : "") + (wa ? '<li><a href="https://wa.me/' + wa + '" target="_blank" rel="noopener">WhatsApp +' + wa + "</a></li>" : "") + (c.instagram ? '<li><a href="https://instagram.com/' + esc(c.instagram) + '" target="_blank" rel="noopener">@' + esc(c.instagram) + "</a></li>" : "") + (c.email ? '<li><a href="mailto:' + esc(c.email) + '">' + esc(c.email) + "</a></li>" : "") + '</ul></div><div><h4>Comprar</h4><ul><li><a href="#/catalogo">Todo el catálogo</a></li>' + S.categorias.slice(0, 5).map(function (k) { return '<li><a href="#/catalogo?cat=' + esc(k.id) + '">' + esc(k.nombre) + "</a></li>"; }).join("") + '</ul><p style="margin-top:12px">Pagos con Mercado Pago.</p></div></div><div class="cp"><div class="wrap" style="display:block;padding:0">© ' + new Date().getFullYear() + " " + esc(c.nombre) + ".</div></div>";
  }

  /* ---------- flechas en todo lo que se desliza ---------- */
  function updArrows(sc) {
    var sw = sc.parentNode, l = sw.querySelector(".ar.l"), r = sw.querySelector(".ar.r"); if (!l || !r) return;
    var max = sc.scrollWidth - sc.clientWidth;
    l.hidden = !(max > 4 && sc.scrollLeft > 4); r.hidden = !(max > 4 && sc.scrollLeft < max - 4);
  }
  function arrows() {
    $$(".rail,.cats ul,.chips").forEach(function (sc) {
      if (sc.dataset.sc) { updArrows(sc); return; }
      var w = document.createElement("div"), cls = sc.classList.contains("rail") ? "rl" : sc.classList.contains("chips") ? "ch" : "cn";
      w.className = "sw " + cls; sc.parentNode.insertBefore(w, sc); w.appendChild(sc); sc.dataset.sc = "1";
      w.insertAdjacentHTML("beforeend", '<button type="button" class="ar l" data-dir="-1" aria-label="Ver anteriores" hidden>' + ic("left") + '</button><button type="button" class="ar r" data-dir="1" aria-label="Ver más" hidden>' + ic("rightc") + "</button>");
      sc.addEventListener("scroll", function () { updArrows(sc); }, { passive: true });
      if (window.ResizeObserver) new ResizeObserver(function () { updArrows(sc); }).observe(sc);
      updArrows(sc);
    });
  }
  function after() {
    window.scrollTo(0, 0); arrows();
    $$("[data-cn]").forEach(function (a) { a.removeAttribute("aria-current"); });
    var m = location.hash.match(/cat=([^&]+)/); if (m && location.hash.indexOf("#/catalogo") === 0) { var a = $('[data-cn="' + decodeURIComponent(m[1]) + '"]'); if (a) a.setAttribute("aria-current", "page"); }
    if (!("IntersectionObserver" in window)) { $$(".rv").forEach(function (e) { e.classList.add("in"); }); return; }
    var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }); }, { rootMargin: "0px 0px -40px 0px" });
    $$(".rv").forEach(function (e) { io.observe(e); });
    setTimeout(function () { $$(".rv:not(.in)").forEach(function (e) { var r = e.getBoundingClientRect(); if (r.top < innerHeight + 200) e.classList.add("in"); }); }, 600);
  }
  function route() {
    var h = location.hash.slice(1) || "/", parts = h.split("?"), path = parts[0], q = new URLSearchParams(parts[1] || ""), m = path.match(/^\/p\/(.+)$/);
    if (m) { if (!view.innerHTML.trim()) { S.under = "#/"; renderHome(); } openProduct(decodeURIComponent(m[1])); return; }
    if ($("#modal").classList.contains("on")) { $("#modal").classList.remove("on"); if (!$("#dr").classList.contains("on")) { $("#scrim").classList.remove("on"); document.body.style.overflow = ""; } }
    S.under = "#" + h; document.body.classList.toggle("in-co", path === "/checkout");
    if (path === "/catalogo") renderCatalog(q); else if (path === "/checkout") renderCheckout(); else if (path === "/gracias") { if (!view.innerHTML.trim()) renderHome(); } else renderHome();
    $("#sug").hidden = true;
  }

  /* ---------- eventos ---------- */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("button,a,[data-scroll]"); if (!t) { if (!e.target.closest("#search")) $("#sug").hidden = true; return; }
    var d = t.dataset;
    if (d.add) { var p = S.byId[d.add]; setQty(d.add, 1); toast("Agregado a tu pedido"); return; }
    if (d.inc) { setQty(d.inc, (S.cart[d.inc] || 0) + 1); return; }
    if (d.dec) { setQty(d.dec, (S.cart[d.dec] || 0) - 1); return; }
    if (d.rm) { setQty(d.rm, 0); return; }
    if (d.fav) {
      var i = S.favs.indexOf(d.fav); if (i > -1) S.favs.splice(i, 1); else { S.favs.push(d.fav); toast("Guardado en favoritos"); }
      lsSet("dm_favs", S.favs); var on = S.favs.indexOf(d.fav) > -1;
      $$('[data-fav="' + d.fav + '"]').forEach(function (b) { b.setAttribute("aria-pressed", on); }); cartUI();
      if (location.hash.indexOf("fav=1") > -1 && !on) route(); return;
    }
    if (t.classList.contains("ar")) { var sc = t.parentNode.querySelector("[data-sc]"); if (sc) sc.scrollBy({ left: Number(d.dir) * Math.max(160, Math.round(sc.clientWidth * 0.7)), behavior: "smooth" }); return; }
    if (d.close !== undefined) { if (t.tagName === "BUTTON") { e.preventDefault(); closeAll(); } else closeAll(); return; }
    if (d.scroll !== undefined) { e.preventDefault(); var el = $("#cat-rubros"); if (el) el.scrollIntoView({ behavior: "smooth" }); return; }
    if (t.id === "cartbtn" || t.id === "cb") { openDrawer(); return; }
  });
  $("#scrim").addEventListener("click", function () { closeAll(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeAll(); });
  window.addEventListener("hashchange", function () { if ($("#dr").classList.contains("on") && location.hash.indexOf("#/p/") !== 0) { $("#dr").classList.remove("on"); $("#scrim").classList.remove("on"); document.body.style.overflow = ""; } route(); });

  var qi = $("#q"), sug = $("#sug"), st;
  function suggest() {
    var t = norm(qi.value.trim()); if (t.length < 2) { sug.hidden = true; return; }
    var ts = t.split(/\s+/), r = S.productos.filter(function (p) { var hay = norm(p.nombre + " " + p.marca); return ts.every(function (x) { return hay.indexOf(x) > -1; }); }).slice(0, 5);
    sug.innerHTML = r.length ? r.map(function (p) { return '<a href="#/p/' + encodeURIComponent(p.id) + '"><img src="' + esc(fs(p.imagen)) + '" alt=""><span><b>' + esc(p.nombre) + "</b><small>" + esc(p.marca) + " · " + esc(p.contenido) + '</small></span><span class="pr">' + money(p.precio) + "</span></a>"; }).join("") + '<a class="all" href="#/catalogo?q=' + encodeURIComponent(qi.value.trim()) + '">Ver todos los resultados</a>' : '<a class="all" href="#/catalogo?q=' + encodeURIComponent(qi.value.trim()) + '">Buscar “' + esc(qi.value.trim()) + "”</a>";
    sug.hidden = false;
  }
  qi.addEventListener("input", function () { clearTimeout(st); st = setTimeout(suggest, 120); });
  $("#sf").addEventListener("submit", function (e) { e.preventDefault(); var v = qi.value.trim(); sug.hidden = true; qi.blur(); location.hash = "#/catalogo" + (v ? "?q=" + encodeURIComponent(v) : ""); });

  /* ---------- arranque ---------- */
  S.cart = lsGet("dm_cart", {}) || {}; S.favs = lsGet("dm_favs", []) || [];
  setData(window.DM_DATA); chrome(); cartUI();
  if (!handleReturn()) route();
  /* El catálogo vivo (el que cambia el panel). Si no responde, queda el que viene con la tienda. */
  if (!CFG.demo && window.fetch) {
    fetch((CFG.apiBase || "") + "/api/catalogo").then(function (r) { if (!r.ok) throw new Error("sin catálogo"); return r.json(); }).then(function (d) {
      if (!d || !d.productos || !d.productos.length || !d.categorias) return;
      var firma = function (x) { return JSON.stringify([x.productos, x.categorias, x.envios, x.config]); }, igual = firma(d) === firma(window.DM_DATA);
      setData(d); chrome(); cartUI();
      if (!igual && !$("#modal").classList.contains("on") && location.hash.indexOf("#/gracias") !== 0 && location.hash.indexOf("#/checkout") !== 0) { var y = window.scrollY; route(); window.scrollTo(0, y); }
    }).catch(function (err) { if (window.console) console.warn("Catálogo en vivo no disponible, se usa la copia publicada:", err.message); });
  }
})();
</script>
</body>
